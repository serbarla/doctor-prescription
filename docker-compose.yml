services:

  persona-sanus:
    build: ./persona-sanus
    ports:
      - "8080:8080"
    environment:
      IP: 0.0.0.0
      DATABASE_URL: sqlite:///data/app.db
      PERSONA_ENV: ${PERSONA_ENV:-development}
      PERSONA_COOKIE_SECURE: ${PERSONA_COOKIE_SECURE:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      PERSONA_WEB_ORIGINS: ${PERSONA_WEB_ORIGINS:-}
      ASSETS_BUCKET: persona-assets
      ASSETS_ENDPOINT: http://minio:9000
      ASSETS_PUBLIC_ENDPOINT: ${ASSETS_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      ASSETS_REGION: us-east-1
      ASSETS_ACCESS_KEY_ID: ${ASSETS_ACCESS_KEY_ID:-persona}
      ASSETS_SECRET_ACCESS_KEY: ${ASSETS_SECRET_ACCESS_KEY:-persona-secret}
      ASSETS_SIGNED_URL_TTL_SECONDS: "900"
      BACKUP_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RETENTION_TRIM_ENABLED: ${RETENTION_TRIM_ENABLED:-true}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-3600}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - persona-data:/data
      - ${PERSONA_BACKUP_DIR:-./backups}:/backups
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: persona-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ASSETS_ACCESS_KEY_ID:-persona}
      MINIO_ROOT_PASSWORD: ${ASSETS_SECRET_ACCESS_KEY:-persona-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - assets-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  persona-data:
  assets-data:
