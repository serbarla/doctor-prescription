services:

  persona-sanus:
    build: ./persona-sanus
    ports:
      - "8080:8080"
    environment:
      IP: 0.0.0.0
      DATABASE_URL: sqlite:///data/app.db
      PERSONA_COOKIE_SECURE: "false"
    volumes:
      - persona-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

volumes:
  persona-data:
