services:

  persona-sanus:
    build: ./persona-sanus
    ports:
      - "8080:8080"
    environment:
      IP: 0.0.0.0
      DATABASE_URL: sqlite:///data/app.db
      PERSONA_COOKIE_SECURE: "false"
      ASSETS_BUCKET: persona-assets
      ASSETS_ENDPOINT: http://minio:9000
      ASSETS_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      ASSETS_REGION: us-east-1
      ASSETS_ACCESS_KEY_ID: persona
      ASSETS_SECRET_ACCESS_KEY: persona-secret
      ASSETS_SIGNED_URL_TTL_SECONDS: "900"
      BACKUP_DIR: /backups
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      RETENTION_TRIM_ENABLED: ${RETENTION_TRIM_ENABLED:-true}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-3600}
    volumes:
      - persona-data:/data
      - ./backups:/backups
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s

  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: persona-minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: persona
      MINIO_ROOT_PASSWORD: persona-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - assets-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  persona-data:
  assets-data:
