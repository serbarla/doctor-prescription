[package]
name = "persona-sanus"
version = "0.1.0"
authors = ["Segio Barba <serbarla@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
dioxus-motion = { version = "0.4", default-features = false, optional = true }
reqwest = { version = "0.12", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"], optional = true }
diesel = { version = "2.3", features = ["sqlite", "r2d2"], optional = true }
diesel_migrations = { version = "2.3", features = ["sqlite"], optional = true }
libsqlite3-sys = { version = "0.38", features = ["bundled"], optional = true }
argon2 = { version = "0.6", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4", "v7"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
unicode-casefold = { version = "0.2", optional = true }
unicode-normalization = { version = "0.1", optional = true }
qrcode-generator = { version = "6.1.2", default-features = false, features = ["std", "qr", "image"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
default = ["web", "server"]
web = ["dioxus/web", "dep:dioxus-motion", "dioxus-motion/web", "dep:chrono"]
desktop = [
    "dioxus/desktop",
    "dep:dioxus-motion",
    "dioxus-motion/desktop",
    "dep:qrcode-generator",
    "dep:chrono",
]
mobile = ["dioxus/mobile"]
server = [
    "dioxus/server",
    "dep:dioxus-motion",
    "dioxus-motion/dioxus",
    "dep:anyhow",
    "dep:axum",
    "dep:tokio",
    "dep:diesel",
    "dep:diesel_migrations",
    "dep:libsqlite3-sys",
    "dep:argon2",
    "dep:sha2",
    "dep:hex",
    "dep:uuid",
    "dep:chrono",
    "dep:unicode-casefold",
    "dep:unicode-normalization",
    "dep:qrcode-generator",
    "dep:tower-http",
]
