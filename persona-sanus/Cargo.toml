[package]
name = "persona-sanus"
version = "0.1.0"
authors = ["Segio Barba <serbarla@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
rustauth = { version = "0.3", features = ["sqlx-sqlite"], optional = true }
rustauth-axum = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"], optional = true }

[features]
default = ["web", "server"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:anyhow", "dep:axum", "dep:sqlx", "dep:rustauth", "dep:rustauth-axum", "dep:tokio"]
